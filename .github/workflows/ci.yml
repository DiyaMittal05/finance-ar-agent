name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # Full pipeline smoke test on the offline mock model (no API keys needed).
      - run: python -m evals.run --provider mock --judge-provider none --versions v3
